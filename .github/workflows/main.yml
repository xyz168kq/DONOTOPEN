name: VM KVM dengan Virt-Install & Auto-Save
on: workflow_dispatch

env:
  LIBVIRT_DEFAULT_URI: 'qemu:///system'

jobs:
   run-vm:
    runs-on: ubuntu-latest
    steps:
    - name: Clone Repositori
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Unduh File Asli dari Git LFS
      run: |
        git lfs install
        git lfs pull

    - name: Instal KVM, Virt-Install, Alat Jaringan & Git LFS
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-kvm libvirt-daemon-system virtinst websockify novnc ssh osinfo-db-tools git-lfs ovmf swtpm swtpm-tools
        git lfs install

    - name: Konfigurasi Hak Akses KVM & Libvirt
      run: |
        sudo chmod 666 /dev/kvm
        sudo chmod 666 /var/run/libvirt/libvirt-sock

    - name: Bersihkan Penyimpanan Runner (Maximize Disk Space)
      run: |
        echo "=== UKURAN SEBELUM DIBERSIHKAN ==="
        df -h
        
        # Hapus paket-paket besar bawaan GitHub Runner yang tidak dipakai
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        
        # Bersihkan cache sistem apt
        sudo apt-get clean
        
        echo "=== UKURAN SETELAH DIBERSIHKAN ==="
        df -h
        
        # Solusi Hak Akses ISO: Berikan izin akses penuh ke folder runner agar qemu bisa membaca file ISO
        sudo chmod 755 /home/runner
        sudo chmod 755 /home/runner/work

    - name: Jalankan Libvirtd Tanpa Systemd
      run: |
        sudo rm -f /var/run/libvirtd.pid
        sudo rm -f /var/run/virtlogd.pid
        sudo rm -rf /var/run/libvirt/*
        sudo mkdir -p /var/run/libvirt
        sudo chmod 755 /var/run/libvirt
        
        echo "Menyalakan daemon virtlogd..."
        sudo /usr/sbin/virtlogd -d
        sleep 2

        echo "Menyalakan daemon libvirtd..."
        sudo /usr/sbin/libvirtd -d
        sleep 5

        echo "MEMATIKAN PROSES DNSMASQ LIAR (Solusi Akhir Address already in use)..."
        # Trik Utama: Mematikan paksa dnsmasq bawaan hantu yang mengunci IP 192.168.122.1
        sudo pkill -9 dnsmasq || true

        echo "Menghancurkan total antarmuka virbr0 yang menyebabkan bentrok..."
        sudo ip link set dev virbr0 down || true
        sudo ip link delete dev virbr0 || true
        
        echo "Membangun ulang konfigurasi jaringan default secara segar..."
        sudo virsh net-destroy default || true
        sudo virsh net-undefine default || true
        
        sudo virsh net-define /usr/share/libvirt/networks/default.xml
        sudo virsh net-start default
        sudo virsh net-autostart default
        
        echo "Memeriksa status jaringan terbaru (Wajib bertuliskan 'active'):"
        sudo virsh net-list --all

    - name: TPM
      run: |
        # Membuat direktori state untuk TPM
        mkdir -p /tmp/emulated_tpm

        # Menjalankan swtpm di latar belakang
        sudo swtpm socket --tpmstate dir=/tmp/emulated_tpm \
        --ctrl type=unixio,path=/tmp/emulated_tpm/swtpm-sock \
        --tpm2 \
        -d
        
    - name: Cek Harddisk Lama (Auto-Load) atau Siapkan Installer Baru
      run: |
        sudo mkdir -p /workspaces/kvm_storage
        sudo chmod 777 /workspaces/kvm_storage
        
        # PERBAIKAN DI SINI: Deteksi file partisi, urutkan alfabetis, lalu gabungkan
        if [ -d "win11-vm-data" ] && ls win11-vm-data/win11-vm.qcow2.part_?? 1> /dev/null 2>&1; then
          echo "Partisi harddisk ditemukan! Menggabungkan berkas secara berurutan..."
          
          # Menggunakan sort untuk memastikan aa, ab, ac... digabungkan dengan benar
          ls win11-vm-data/win11-vm.qcow2.part_?? | sort | xargs cat > /workspaceskvm_storage/win11-vm.qcow2
          
          # Validasi apakah hasil penggabungan menghasilkan format qcow2 yang valid
          echo "Memverifikasi integritas file hasil penggabungan:"
          qemu-img info /workspaces/kvm_storage/win11-vm.qcow2
          
          echo "BOOT_MODE=saved" >> $GITHUB_ENV
        else
          echo "Harddisk tidak ditemukan. Menyiapkan instalasi baru dari ISO..."
          echo "Unduh ISO Windows 11..."
          cd /tmp
          wget "https://downloads.sourceforge.net/project/tiny-11-releases/Tiny11-Pro-25H2/Tiny11-25H2-26200.8037-English-Pro-2026-08-23.iso?ts=gAAAAABqrkuCHuAxtCTNsPOiCteIlpi80gz7LU8KIEcEhA4LmNCZDQu54p48ONrGbnq8F0RlrGw3vHAPOY12mfkEuioHGvMz2A%3D%3D&r=https%3A%2F%2Fsourceforge.net%2Fprojects%2Ftiny-11-releases%2Ffiles%2Flatest%2Fdownload" -O installer.iso
          cd /workspaces/DONOTOPEN/
          echo "BOOT_MODE=new" >> $GITHUB_ENV
        fi

    - name: Jalankan VM Menggunakan Virt-Install
      run: |
        if [ "${{ env.BOOT_MODE }}" = "new" ]; then
          cd /tmp
          qemu-img create -f qcow2 win11-vm.qcow2 64G
          cd /workspaces/kvm_storage/
          cp /usr/share/OVMF/OVMF_VARS_4M.fd /tmp/win11_vars.fd
          echo "Memulai VM baru dari CD-ROM (RAM 4096)..."
          # Menambahkan sparse=true agar file qcow2 dibuat secara dinamis (ringan)
          # Menambahkan --check all=off untuk mengabaikan error jaringan dan ukuran pool
          sudo qemu-system-x86_64 \
          -enable-kvm \
          -name win11-vm \
          -machine q35,smm=on \
          -global ICH9-LPC.disable_s3=1 \
          -global driver=cfi.pflash01,property=secure,value=on \
          -m 4096 \
          -smp 2 \
          -cpu host \
          -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.secboot.fd \
          -drive if=pflash,format=raw,file=/tmp/win11_vars.fd \
          -chardev socket,id=chrtpm,path=/tmp/emulated_tpm/swtpm-sock \
          -tpmdev emulator,id=tpm0,chardev=chrtpm \
          -device tpm-tis,tpmdev=tpm0 \
          -drive file=/tmp/win11-vm.qcow2,format=qcow2,id=hd0,if=none \
          -device nvme,drive=hd0,serial=nvme-disk0 \
          -device ahci,id=ahci0 \
          -device ide-cd,bus=ahci0.0,drive=cdrom0 \
          -drive file=/tmp/installer.iso,id=cdrom0,if=none,media=cdrom \
          -boot menu=on,order=d \
          -device usb-ehci,id=usb -device usb-tablet \
          -net nic,model=e1000e -net user \
          -vga qxl \
          -vnc 0.0.0.0:1 \
          -daemonize
        else
          cp /usr/share/OVMF/OVMF_VARS_4M.fd /tmp/win11_vars.fd
          echo "Memulai VM melanjutkan sesi kemarin (RAM 4096)..."
          sudo qemu-system-x86_64 \
          -enable-kvm \
          -name win11-vm \
          -machine q35,smm=on \
          -global ICH9-LPC.disable_s3=1 \
          -global driver=cfi.pflash01,property=secure,value=on \
          -m 4096 \
          -smp 2 \
          -cpu host \
          -drive if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE_4M.secboot.fd \
          -drive if=pflash,format=raw,file=/tmp/win11_vars.fd \
          -chardev socket,id=chrtpm,path=/tmp/emulated_tpm/swtpm-sock \
          -tpmdev emulator,id=tpm0,chardev=chrtpm \
          -device tpm-tis,tpmdev=tpm0 \
          -drive file=/workspaces/kvm_storage/win11-vm.qcow2,format=qcow2,id=hd0,if=none \
          -device nvme,drive=hd0,serial=nvme-disk0 \
          -boot order=c \
          -net nic,model=e1000e -net user \
          -device usb-ehci,id=usb -device usb-tablet \
          -vga qxl \
          -display none \
          -vnc 0.0.0.0:1 \
          -daemonize
         fi
    - name: Jembatani dengan Websockify & Buka Jalur Link Browser
      run: |
        cd /workspaces/DONOTOPEN/DONOTOPEN
        websockify --web /usr/share/novnc/ 6080 localhost:5901 &
        # 1. Pastikan Node.js dan npm terinstal
        sudo apt-get update && sudo apt-get install -y nodejs npm
        
        # 2. Instal localtunnel secara global
        sudo npm install -g localtunnel
        
        # 3. Jalankan localtunnel di background dan buang hasilnya ke file log
        nohup lt --port 6080 > tunnel.log 2>&1 &
        
        # 4. Beri jeda 5 detik agar localtunnel selesai membuat link
        sleep 5
        
        # 5. Cetak (cat) link localtunnel tersebut ke layar log GitHub Actions
        echo "=== LINK NOVNC ANDA DI BAWAH INI ==="
        cat tunnel.log
        echo "====================================="
        
        # 6. Cetak juga IP publik runner untuk password localtunnel Anda nanti
        echo "=== PASSWORD TUNNEL (IP RUNNER) ==="
        curl ifconfig.me
        echo -e "\n====================================="
        
        echo "========================================================================"
        echo "VM KAMU AKTIF! UNTUK MENYIMPAN PERUBAHAN SECARA OTOMATIS KE GITHUB:"
        echo "SHUTDOWN ATAU MATIKAN OS DI DALAM LAYAR noVNC KAMU."
        echo "========================================================================"

    - name: Menunggu VM Dimatikan (Auto-Save Trigger)
      run: |
        while pgrep -f "qemu-system-x86_64.*-name win11-vm" > /dev/null; do
        sleep 5
        done
        echo "VM terdeteksi mati secara aman. Memulai proses Auto-Save ke Cloud..."

    - name: Auto-Save Perubahan Harddisk ke GitHub
      run: |
        # Kompres berkas dari /tmp ke storage internal actions
        mv /workspaces/kvm_storage/win11-vm.qcow2 /workspaces/kvm_storage/win111-vm.qcow2
        qemu-img convert -O qcow2 -c /workspaces/kvm_storage/win111-vm.qcow2 /workspaces/kvm_storage/win11-vm.qcow2
        
        # EDIT DI SINI: Membuat folder khusus dan membersihkan pecahan lama
        mkdir -p win11-vm-data
        rm -f win11-vm-data/win11-vm.qcow2.part_*
        
        # EDIT DI SINI: Potong file 14GB menjadi pecahan 1.5GB langsung ke dalam folder khusus
        split -b 1500M /workspaces/kvm_storage/win11-vm.qcow2 win11-vm-data/win11-vm.qcow2.part_
        
        # Konfigurasi Git LFS untuk folder khusus
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # EDIT DI SINI: Daftarkan LFS untuk melacak file partisi di folder tersebut
        git lfs track "win11-vm-data/win11-vm.qcow2.part_*"
        git add .gitattributes
        
        # EDIT DI SINI: Push folder data partisi saja (Berkas utuh 14GB ditinggalkan/jangan di-add)
        git add win11-vm-data/win11-vm.qcow2.part_*
        git commit -m "Auto-Save: Memperbarui berkas sistem dalam bentuk partisi split di folder khusus"
        git push origin main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        
